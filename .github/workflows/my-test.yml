      - name: Крок 3 Самостійний запуск Adminer по SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            echo "=== УСПІШНО ПІДКЛЮЧЕНО ДО ANSIBLE1 ==="
            
            # 🎯 ЗАВДАННЯ 2.1: Створи нову чисту папку на сервері для цього проєкту.
            # Наприклад: /root/adminer-panel
            mkdir -p _______
            
            # 🎯 ЗАВДАННЯ 2.2: Скопіюй файл docker-compose.yml з папки деплою 
            # (/root/github-actions-test/docker-compose.yml) у твою нову створену папку.
            cp /root/github-actions-test/docker-compose.yml _______/docker-compose.yml
            
            # 🎯 ЗАВДАННЯ 2.3: Перейди всередину своєї нової папки
            cd _______
            
            echo "=== ЗАПУСКАЄМО АДМІНКУ БАЗ ДАНИХ ==="
            # 🎯 ЗАВДАННЯ 2.4: Напиши стандартну команду запуску Docker Compose у фоновому режимі з форсованим перестворенням
            _______
            
            echo "=== ПЕРЕВІРКА ЗАПУЩЕНИХ ПРОЦЕСІВ ==="
            sleep 3
            docker ps
