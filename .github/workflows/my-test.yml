name: Автоматичний Деплой (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Крок 1 Клонування коду
        uses: actions/checkout@v4

      - name: Крок 2 Копіювання файлів
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/root/github-actions-test"

      - name: Крок 3 Самостійний запуск Adminer по SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            echo "=== УСПІШНО ПІДКЛЮЧЕНО ДО ANSIBLE1 ==="
            
            mkdir -p /root/mysql-adminer
            cp /root/github-actions-test/docker-compose.yml /root/mysql-adminer/docker-compose.yml
            cd /root/mysql-adminer
            
            echo "=== ЗАПУСКАЄМО АДМІНКУ БАЗ ДАНИХ ==="
            docker compose up -d --force-recreate
            
            echo "=== ПЕРЕВІРКА ЗАПУЩЕНИХ ПРОЦЕСІВ ==="
            sleep 3
            docker ps
