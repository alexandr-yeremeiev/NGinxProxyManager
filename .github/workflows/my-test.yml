name: Автоматичний Деплой (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Крок 1 Клонування коду
        uses: actions/checkout@v4

      - name: Крок 2 Копіювання файлів
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/root/github-actions-test"

      - name: Крок 3 Оптимізований запуск проєкту по SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          # command_timeout: збільшуємо час очікування, щоб GitHub не обривав зв'язок
          command_timeout: 10m
          script: |
            echo "=== УСПІШНО ПІДКЛЮЧЕНО ДО ANSIBLE1 ==="
            cd /root/github-actions-test
            
            echo "=== 1. НАДАЄМО ПРАВА СКРИПТУ ==="
            chmod +x NPM-Autoinstaller
            
            echo "=== 2. ЗАПУСКАЄМО АВТОІНСТАЛЯЦІЮ У ТИХОМУ РЕЖИМІ ==="
            # Запускаємо скрипт так, щоб він не спамив логами і не вішав пам'ять
            ./NPM-Autoinstaller > /dev/null 2>&1 &
            
            # Даємо серверу 5 секунд ініціалізувати запуск
            sleep 5
            
            echo "=== 3. ПЕРЕВІРКА СТАТУСУ ЗАПУСКУ ==="
            docker ps
