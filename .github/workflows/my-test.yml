name: Автоматичний Деплой Сервера

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Крок 1. Клонування коду з Гітхабу
        uses: actions/checkout@v4

      - name: Крок 2. Надання прав користувачу (якщо потрібно)
        run: |
          echo "Перевіряємо файли в репозиторії:"
          ls -la

      - name: Крок 3. Локальний запуск Docker Compose
        run: |
          echo "Запускаємо контейнери безпосередньо на вашому сервері..."
          docker compose up -d --build
