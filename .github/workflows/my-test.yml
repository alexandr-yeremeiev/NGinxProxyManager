name: Автоматичний Деплой (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Крок 1: Клонування коду на сервері GitHub
        uses: actions/checkout@v4

      - name: Крок 2: Автоматичне копіювання файлів на ваш сервер
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/root/github-actions-test"

      - name: Крок 3: Запуск Nginx Proxy Manager по SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== УСПІШНО ПІДКЛЮЧЕНО ДО ANSIBLE1 ==="
            cd /root/github-actions-test
            
            echo "=== ЗАПУСКАЄМО NGING X PROXY MANAGER ==="
            docker compose up -d --force-recreate
            
            echo "=== СПИСОК ЗАПУЩЕНИХ КОНТЕЙНЕРІВ ==="
            docker ps
