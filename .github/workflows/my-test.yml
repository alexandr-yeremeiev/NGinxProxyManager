name: Автоматичний Деплой (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Клонування коду
        uses: actions/checkout@v4

      - name: Підключення по SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== УСПІШНО ПІДКЛЮЧЕНО ДО ANSIBLE1 ==="
            docker ps -a
