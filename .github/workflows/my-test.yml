name: Автоматичний Деплой (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    # 🔐 Передаємо секрети з GitHub у змінні сервера на час деплою
    env:
      SECRET_DB_ROOT_PASS: ${{ secrets.DB_ROOT_PASSWORD }}
      SECRET_WP_DB_PASS: ${{ secrets.WP_DB_PASSWORD }}
      MC_OPS_PLAYER: ${{ secrets.MINECRAFT_OPS }}

    steps:
      - name: Крок 1. Клонування коду з Гітхабу
        uses: actions/checkout@v4

      - name: Крок 2. Перевірка файлів у репозиторії
        run: |
          echo "Поточна директорія деплою:"
          pwd
          echo "Список файлів у репозиторії:"
          ls -la

      - name: Крок 3. Локальний запуск Docker Compose
        run: |
          echo "Очищаємо систему від старих контейнерів та запускаємо нові..."
          docker compose up -d --build --remove-orphans
          echo "========================================================="
          echo " Деплой завершено успішно!"
          echo " Контейнери-сироти видалені автоматично."
          echo "========================================================="
