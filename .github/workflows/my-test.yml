name: Автоматичний Деплой (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Крок 1 Клонування коду
        uses: actions/checkout@v4

      - name: Крок 2 Копіювання файлів
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/root/github-actions-test"

      - name: Крок 3 Автоматичний запуск Minecraft по SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            echo "=== УСПІШНО ПІДКЛЮЧЕНО ДО ANSIBLE1 ==="
            
            # 1. Создаем изолированную папку для Майнкрафта
            mkdir -p /root/minecraft-server
            
            # 2. Переносим файл конфигурации из папки деплоя в папку запуска
            cp /root/github-actions-test/docker-compose.yml /root/minecraft-server/docker-compose.yml
            cd /root/minecraft-server
            
            echo "=== ЗАПУСКАЄМО MINECRAFT FABRIC SERVER ==="
            # Запускаем контейнер. Флаг -d скачает образ и запустит игру
            docker compose up -d --force-recreate
            
            echo "=== ПЕРЕВІРКА ЗАПУЩЕНИХ КОНТЕЙНЕРІВ ==="
            sleep 3
            docker ps
