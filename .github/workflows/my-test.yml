name: Автоматичний Деплой (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Крок 1 Клонування коду
        uses: actions/checkout@v4

      - name: Крок 2 Копіювання файлів
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/root/github-actions-test"

      - name: Крок 3 Запуск проєкту по SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== УСПІШНО ПІДКЛЮЧЕНО ДО ANSIBLE1 ==="
            cd /root/github-actions-test
            echo "=== ЗАПУСКАЄМО DOCKER ==="
            docker compose up -d --force-recreate
            echo "=== СПИСОК КОНТЕЙНЕРІВ ==="
            docker ps
