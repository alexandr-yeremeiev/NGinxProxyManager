name: Автоматичний Деплой (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Крок 1 Клонування коду
        uses: actions/checkout@v4

      - name: Крок 2 Перевірка файлів (для логів)
        run: |
          echo "Поточна директорія деплою:"
          pwd
          echo "Список файлів у репозиторії:"
          ls -la

      - name: Крок 3 Локальний запуск Docker Compose
        run: |
          echo "Запускаємо ваші контейнери NGinxProxyManager..."
          docker compose up -d --build
