name: Автоматичний Деплой (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Крок 1 Клонування коду
        uses: actions/checkout@v4

      - name: Крок 2 Копіювання файлів
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/root/github-actions-test"

      - name: Крок 3 Чистий запуск Nginx Proxy Manager
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            echo "=== УСПІШНО ПІДКЛЮЧЕНО ДО ANSIBLE1 ==="
            
            # 1. Створюємо чисту ізольовану папку для NPM
            mkdir -p /root/nginx-proxy-manager
            cd /root/nginx-proxy-manager
            
            # 2. Записуємо чисту офіційну конфігурацію вебсервера
            cat << 'EOF' > docker-compose.yml
            version: '3.8'
            services:
              app:
                image: 'jc21/nginx-proxy-manager:latest'
                restart: unless-stopped
                ports:
                  - '80:80'
                  - '81:81'
                  - '443:443'
                volumes:
                  - ./data:/data
                  - ./letsencrypt:/etc/letsencrypt
            EOF
            
            echo "=== ЗАПУСКАЄМО ОФІЦІЙНИЙ КОНТЕЙНЕР NPM ==="
            # Запускаємо в активному для SSH режимі, щоб бачити помилки, якщо вони будуть
            docker compose up -d --force-recreate
            
            echo "=== ПЕРЕВІРКА ЗАПУЩЕНИХ ПРОЦЕСІВ ==="
            sleep 3
            docker ps
