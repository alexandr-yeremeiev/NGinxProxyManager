version: '3.8'

services:
  mc-server:
    image: 'itzg/minecraft-server:java25'
    container_name: minecraft-fabric-server
    ports:
      - '25565:25565'
    environment:
      EULA: 'TRUE'
      TYPE: 'FABRIC'
      VERSION: '26.1.2'
      MEMORY: '4G'
      ONLINE_MODE: 'FALSE'
      CREATE_CONSOLE_IN_PIPE: 'true'
      AUTOPAUSE: 'FALSE'
      OPS: 'Sasha'
    volumes:
      - ./data:/data
    restart: unless-stopped
