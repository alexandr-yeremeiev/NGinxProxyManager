version: '3.8'

services:
  # --- БЛОК 1: ВЕБ-САЙТ WORDPRESS ---
  db:
    image: mariadb:11
    container_name: wordpress-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SECRET_DB_ROOT_PASS}
      MYSQL_DATABASE: wordpress_site
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: ${SECRET_WP_DB_PASS}
    volumes:
      - db_data_v2:/var/lib/mysql

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wordpress-app
    restart: unless-stopped
    ports:
      - "8080:80" # Вордпрес на порту 8080
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: ${SECRET_WP_DB_PASS}
      WORDPRESS_DB_NAME: wordpress_site
    volumes:
      - wp_data:/var/www/html

  # --- БЛОК 2: ІГРОВИЙ СЕРВЕР MINECRAFT ---
  mc-server:
    image: itzg/minecraft-server:java25
    container_name: minecraft-fabric-server
    restart: unless-stopped
    ports:
      - "25565:25565" # Майнкрафт на стандартному порту 25565
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.1.2"
      MEMORY: "4G"
      ONLINE_MODE: "FALSE"
      CREATE_CONSOLE_IN_PIPE: "true"
      AUTOPAUSE: "FALSE"
      OPS: ${MC_OPS_PLAYER}
    volumes:
      - mc_data:/data

# Оголошуємо незалежні диски для збереження даних
volumes:
  db_data_v2:
  wp_data:
  mc_data:
